apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogbackend
  labels:
    app: catalogbackend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalogbackend
  template:
    metadata:
      labels:
        app: catalogbackend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9102"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: catalogbackend:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9102
          envFrom:
            - configMapRef:
                name: catalogbackend-config
            - secretRef:
                name: catalog-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalogbackend
spec:
  selector:
    app: catalogbackend
  ports:
    - name: http
      port: 8080
      targetPort: http