apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogbackend
  labels:
    app: catalogbackend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: catalogbackend
  template:
    metadata:
      labels:
        app: catalogbackend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9102"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: catalogbackend:v1
          imagePullPolicy: Never
          env:
            - name: VERSION
              value: "v1"
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9102
          envFrom:
            - configMapRef:
                name: catalogbackend-config
            - secretRef:
                name: catalog-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20