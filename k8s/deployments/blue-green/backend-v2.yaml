apiVersion: v1
kind: Service
metadata:
  name: catalogbackend-v2
  labels:
    app: catalogbackend
    version: v2
spec:
  selector:
    app: catalogbackend
    version: v2
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogbackend-v2
  labels:
    app: catalogbackend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogbackend
  template:
    metadata:
      labels:
        app: catalogbackend
        version: v2
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9102"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: catalogbackend:v2
          imagePullPolicy: Never
          env:
            - name: VERSION
              value: "v2"
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9102
          envFrom:
            - configMapRef:
                name: catalogbackend-config
            - secretRef:
                name: catalog-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
  