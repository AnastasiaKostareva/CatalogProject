apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: catalogbackend
spec:
  parentRefs:
    - name: eg
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-user-group
              value: beta
      backendRefs:
        - name: catalogbackend-v2
          port: 8080
    - backendRefs:
        - name: catalogbackend-v1
          port: 8080