apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogfrontend
  labels:
    app: catalogfrontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogfrontend
  template:
    metadata:
      labels:
        app: catalogfrontend
    spec:
      containers:
        - name: frontend
          image: catalogfrontend:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: catalogfrontend
  labels:
    app: catalogfrontend
spec:
  type: NodePort
  selector:
    app: catalogfrontend
  ports:
    - name: http
      port: 80
      targetPort: http