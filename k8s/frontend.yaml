apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogfrontend
  labels:
    app: catalogfrontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogfrontend
  template:
    metadata:
      labels:
        app: catalogfrontend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9113"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: frontend
          image: catalogfrontend:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.5.1
          args:
            - "--nginx.scrape-uri=http://localhost/status"
          ports:
            - name: metrics
              containerPort: 9113
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalogfrontend
  labels:
    app: catalogfrontend
spec:
  type: NodePort
  selector:
    app: catalogfrontend
  ports:
    - name: http
      port: 80
      targetPort: http