<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой каталог книг</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<header class="bg-white border-bottom py-3 mb-4 shadow-sm">
  <div class="container d-flex justify-content-between align-items-center">
    <h1 class="h3 mb-0 text-primary">Мой каталог книг</h1>
    <button id="add-book-btn" class="btn btn-primary">
      + Добавить книгу
    </button>
  </div>
</header>

<main class="container">
  <div id="books-grid" class="row g-4">
  </div>
</main>

<div class="modal fade" id="bookModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <form id="book-form" novalidate>
        <input type="hidden" id="book-id">

        <div class="modal-header">
          <h5 class="modal-title" id="modal-title">Добавить книгу</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>

        <div class="modal-body">
          <div class="row g-3">
            
            <div class="col-md-8">
              <label for="book-title" class="form-label">Название *</label>
              <input type="text" class="form-control" id="book-title"
                     required maxlength="128">
              <div class="invalid-feedback">Введите название (до 128 символов)</div>
            </div>
            
            <div class="col-md-4">
              <label for="book-year" class="form-label">Год издания</label>
              <input type="number" class="form-control" id="book-year"
                     min="1" max="2026">
              <div class="invalid-feedback">Год должен быть от 1 до 2026</div>
            </div>

            <div class="col-md-6">
              <label for="book-author" class="form-label">Автор *</label>
              <input type="text" class="form-control" id="book-author"
                     required maxlength="64">
              <div class="invalid-feedback">Введите автора (до 64 символов)</div>
            </div>

            <!-- Жанр -->
            <div class="col-md-6">
              <label for="book-genre" class="form-label">Жанр</label>
              <input type="text" class="form-control" id="book-genre"
                     maxlength="32" placeholder="Фантастика, роман, ...">
            </div>

            <div class="col-md-6">
              <label for="book-language" class="form-label">Язык *</label>
              <input type="text" class="form-control" id="book-language"
                     required maxlength="32" placeholder="Русский">
              <div class="invalid-feedback">Введите язык</div>
            </div>

            <div class="col-md-6">
              <label for="book-rating" class="form-label">Рейтинг (1–5) *</label>
              <input type="number" class="form-control" id="book-rating"
                     min="1" max="5" value="5" required>
              <div class="invalid-feedback">Рейтинг от 1 до 5</div>
            </div>

            <div class="col-12">
              <label for="book-image" class="form-label">URL обложки</label>
              <input type="url" class="form-control" id="book-image"
                     maxlength="256" placeholder="https://example.com/cover.jpg">
              <div class="invalid-feedback">Введите корректный URL (до 256 символов)</div>
            </div>

            <div class="col-12">
              <label for="book-summary" class="form-label">Отзыв</label>
              <textarea class="form-control" id="book-summary"
                        rows="3" placeholder="Ваши впечатления о книге..."></textarea>
            </div>

            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="book-in-process">
                <label class="form-check-label" for="book-in-process">
                  📖 Читаю сейчас
                </label>
              </div>
            </div>

            <div class="col-12">
              <div id="form-error" class="alert alert-danger d-none" role="alert"></div>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
          <button type="submit" class="btn btn-primary" id="save-btn">Сохранить</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="/script.js"></script>
</body>
</html>
